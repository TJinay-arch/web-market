{% extends "catalog/base.html" %}

{% block content %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="post" class="border p-4 rounded">
                {% csrf_token %}
                <div class="d-flex justify-content-center mt-3">
                    <a class="p-2 btn btn-danger mx-2" href="{% url 'catalog:home' %}">Да, выйти</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
